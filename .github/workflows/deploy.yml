name: Deploy unified site to GitHub Pages

# Trigger on push to either branch. Whichever pushes, rebuild the standard
# portfolio from main at / and the optional 3D experience from Redesign at
# /experience/ as one merged artifact.
on:
  push:
    branches: [Redesign, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ---------- Redesign (3D experience under /experience/) ----------
      - name: Checkout Redesign branch
        uses: actions/checkout@v4
        with:
          ref: Redesign
          path: redesign

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Redesign deps
        working-directory: redesign
        run: npm ci

      - name: Build Redesign (/experience/)
        working-directory: redesign
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_AUTOREPLY_TEMPLATE_ID: ${{ secrets.EMAILJS_AUTOREPLY_TEMPLATE_ID }}
        run: |
          npm run inject:env
          npx ng build --base-href=/experience/ --configuration production

      - name: Locate Redesign output
        id: redesign_out
        run: |
          DIR=$(find redesign/dist -maxdepth 3 -type d -name browser | head -n 1)
          if [ -z "$DIR" ]; then
            DIR=$(find redesign/dist -maxdepth 3 -type d -name 'portfolio*' | head -n 1)
          fi
          echo "Redesign output: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # ---------- main (standard portfolio at /) ----------
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: standard

      - name: Install main dependencies
        working-directory: standard
        run: npm ci

      - name: Build main site (/)
        working-directory: standard
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_AUTOREPLY_TEMPLATE_ID: ${{ secrets.EMAILJS_AUTOREPLY_TEMPLATE_ID }}
        run: |
          npm run inject:env
          npx ng build --base-href=/ --configuration production

      - name: Locate main output
        id: standard_out
        run: |
          DIR=$(find standard/dist -maxdepth 3 -type d -name browser | head -n 1)
          if [ -z "$DIR" ]; then
            DIR=$(find standard/dist -maxdepth 3 -mindepth 2 -type d | head -n 1)
          fi
          echo "Main output: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # ---------- Merge ----------
      - name: Merge outputs into _site
        run: |
          mkdir -p _site
          cp -r "${{ steps.standard_out.outputs.dir }}/." _site/
          mkdir -p _site/experience
          cp -r "${{ steps.redesign_out.outputs.dir }}/." _site/experience/
          cp _site/index.html _site/404.html
          cp _site/experience/index.html _site/experience/404.html
          touch _site/.nojekyll
          ls -la _site
          ls -la _site/experience

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
