<div class="experience-root">
  <canvas #canvas class="three-canvas"></canvas>

  <header class="hud-top">
    <div class="active-zone">
      <small>now</small>
      <strong>{{ zoneTitle(activeIndex()) }}</strong>
    </div>
    <a class="escape" routerLink="/page">Skip to text version</a>
  </header>

  @if (showHint()) {
    <div class="hint" aria-hidden="true">
      <span>Scroll · drag · arrow keys to walk the path</span>
    </div>
  }

  @if (hoverIndex() !== null) {
    <div class="tooltip">{{ zoneTitle(hoverIndex()) }}</div>
  }
</div>
